# DEPRECATED (2026-10-29): Supabase 런타임은 중단.
# 운영은 docker-compose.yml 내장 Postgres만 사용.
# 데이터 이전: ./scripts/migrate_from_supabase.sh
#
# 이 오버레이를 쓰면 내장 db가 꺼지고 원격 DATABASE_URL로 붙습니다. 신규 운영 금지.
name: vehiclehub

services:
  db:
    profiles: ["disabled"]

  web:
    depends_on: !reset []
    environment:
      DATABASE_URL: ${SUPABASE_DATABASE_URL:-${DATABASE_URL:?DATABASE_URL 또는 SUPABASE_DATABASE_URL 필요}}

  scheduler:
    depends_on: !reset []
    environment:
      DATABASE_URL: ${SUPABASE_DATABASE_URL:-${DATABASE_URL:?DATABASE_URL 또는 SUPABASE_DATABASE_URL 필요}}
