<!--
  [UI Flow]
  1. Auth entry: POST /login
  2. Data: form username/password
  3. States: error flash | success redirect /
  4. Actions → dashboard
-->
{% extends "base.html" %}
{% block title %}로그인 · Vehicle Hub{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="glass login-card">
    <h1 class="brand-hero">Vehicle Hub</h1>
    <p class="text-muted">크롤링 매물 DB · API 허브</p>
    <form method="post" action="{{ url_for('admin.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="username">아이디</label>
        <input class="form-control" id="username" name="username" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-accent w-100" type="submit">로그인</button>
    </form>
  </div>
</section>
{% endblock %}
