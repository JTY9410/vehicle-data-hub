[project]
name = "vehicle-data-hub"
version = "0.1.0"
description = "Vehicle CSV PostgreSQL API Hub"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1.3,<3.2",
  "SQLAlchemy>=2.0.36,<2.1",
  "Flask-SQLAlchemy>=3.1.1,<3.2",
  "Flask-Migrate>=4.1,<5",
  "Flask-Login>=0.6.3,<0.7",
  "Flask-WTF>=1.2,<2",
  "python-dotenv>=1.0,<2",
  "gunicorn>=23,<25",
  "Werkzeug>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
